name: Build iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Check Hangul composition
        # Run the pure Swift composer checks on the Mac before building UIKit.
        # No test target or third-party dependency is required.
        shell: bash
        run: |
          set -euo pipefail
          swiftc KeyboardExtension/HangulComposer.swift Tests/HangulComposerChecks.swift -o "$RUNNER_TEMP/hangul-checks"
          "$RUNNER_TEMP/hangul-checks"
          swiftc -typecheck KeyboardExtension/ConversationalTranslator.swift
          node --test Backend/worker.test.mjs

      - name: Build iOS app and extension
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild \
            -project Translator.xcodeproj \
            -scheme Translator \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build.log

      - name: Package unsigned IPA with keyboard extension
        shell: bash
        run: |
          set -euo pipefail
          app="build/DerivedData/Build/Products/Release-iphoneos/Translator.app"
          test -f "$app/Translator"
          test -f "$app/PlugIns/TranslatorKeyboard.appex/TranslatorKeyboard"
          mkdir -p build/package/Payload
          ditto "$app" build/package/Payload/Translator.app
          cd build/package
          /usr/bin/zip -r -q ../Translator-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Translator-unsigned-IPA
          path: build/Translator-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
